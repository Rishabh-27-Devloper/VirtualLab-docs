<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VirtualLab-HIL — Documentation & User Manual</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Official documentation, comprehensive user manual, and component encyclopedia for VirtualLab-HIL — Next-Gen Mixed-Signal Electronic Circuit Simulator & Hardware-in-the-Loop Platform.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Docsify Theme & KaTeX -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css">
  
  <style>
    :root {
      --theme-color: #0284c7;
      --base-font-size: 15px;
      --sidebar-width: 290px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .sidebar {
      background-color: #090d16;
      border-right: 1px solid #1e293b;
      color: #94a3b8;
    }
    .sidebar ul li a {
      color: #94a3b8;
      font-size: 13.5px;
      padding: 6px 12px;
      transition: all 0.15s ease;
    }
    .sidebar ul li a:hover {
      color: #38bdf8;
      background-color: rgba(56, 189, 248, 0.08);
      border-radius: 6px;
    }
    .sidebar ul li.active > a {
      color: #38bdf8;
      font-weight: 700;
      background-color: rgba(56, 189, 248, 0.12);
      border-radius: 6px;
    }
    .app-name-link {
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #38bdf8 !important;
      font-size: 17px !important;
    }
    .markdown-section code {
      border-radius: 4px;
      padding: 2px 6px;
      background: #f1f5f9;
      color: #0369a1;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9em;
    }
    .markdown-section pre > code {
      background: #090d16;
      color: #e2e8f0;
      padding: 1rem;
      border-radius: 8px;
    }
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }
    .markdown-section th {
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 10px 12px;
      font-weight: 700;
    }
    .markdown-section td {
      border: 1px solid #e2e8f0;
      padding: 9px 12px;
    }
    .markdown-section img {
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      border: 1px solid #e2e8f0;
      max-width: 100%;
      margin: 1rem 0;
    }
    .search input {
      border-radius: 6px !important;
      border: 1px solid #334155 !important;
      background-color: #0f172a !important;
      color: #f8fafc !important;
    }
    .search input::placeholder {
      color: #64748b;
    }
  </style>
</head>
<body>
  <div id="app">Loading VirtualLab-HIL Documentation...</div>
  <script>
    window.$docsify = {
      name: '⚡ VirtualLab-HIL',
      repo: 'https://github.com/Rishabh-27-Devloper/VirtualLabs-HIL',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No matching documentation found',
        depth: 4,
        hideOtherSidebarContent: false,
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy Code Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- Zoom Image Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <!-- KaTeX Math -->
  <script src="//cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/marked@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-katex@latest/dist/docsify-katex.js"></script>
  <!-- Syntax Highlighting -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-c.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-cpp.min.js"></script>
</body>
</html>
